name: Refresh dependency lockfile (temporary migration)
on:
  push:
    branches: [feat/compact-10inch-scroll-jump-ui]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
      - name: Resolve modern Forge 8 dependency graph without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit only updated package-lock to this migration branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(lock): resolve Forge 8 and Vite 8 dependency graph'
            git push origin HEAD:feat/compact-10inch-scroll-jump-ui
          fi
