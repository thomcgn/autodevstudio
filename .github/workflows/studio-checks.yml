name: Studio checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies (skip desktop binary on CI)
        run: node scripts/strict-check.mjs install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: TypeScript
        run: node scripts/strict-check.mjs typecheck
      - name: Execution approval policy tests
        run: node scripts/strict-check.mjs policy

  ui-smoke:
    name: Renderer click tests (Playwright)
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: node scripts/strict-check.mjs install
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install pinned Playwright test runner without modifying lockfile
        run: node scripts/strict-check.mjs playwrightDependency
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Install headless Chromium
        run: node scripts/strict-check.mjs playwrightBrowser
      - name: Click-test real React UI with mocked IPC
        run: node scripts/strict-check.mjs ui

  desktop-smoke:
    name: Packaged Electron integration (Playwright)
    needs: [typecheck, ui-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install desktop dependencies
        run: node scripts/strict-check.mjs install
      - name: Install pinned Playwright test runner without lockfile changes
        run: node scripts/strict-check.mjs playwrightDependency
      - name: Build standalone desktop app
        run: node scripts/strict-check.mjs package
      - name: Native Electron desktop click and IPC smoke
        run: xvfb-run -a node scripts/strict-check.mjs desktop
